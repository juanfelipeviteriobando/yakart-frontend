<div class="register-container fade-in">
  <div class="register-card">

    <div class="text-center mb-4">
      <img src="../../../../img/yakart-logo.png" alt="logo" height="55" class="mb-3" />
      <h2 class="title">¿Olvidaste tu contraseña?</h2>
      <p class="subtitle">Ingresa tu correo para enviarte un enlace de recuperación</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form-body">

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          pInputText
          formControlName="email"
          class="input-field"
          placeholder="correo@ejemplo.com"
        />

        <small *ngIf="form.get('email')?.touched && form.get('email')?.invalid"
               class="error-msg">
          Ingresa un correo válido.
        </small>
      </div>

      <button
        pButton
        pRipple
        label="Enviar enlace de recuperación"
        class="pink-btn mt-3"
        [disabled]="loading"
      ></button>

      <div *ngIf="error" class="error-response mt-3">{{ error }}</div>
      <div *ngIf="success" class="success-response mt-3">{{ success }}</div>

      <div class="text-center mt-4">
        <a (click)="login()" class="back-link">← Volver al inicio de sesión</a>
      </div>

    </form>

  </div>
</div>
