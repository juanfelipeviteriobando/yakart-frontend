<div class="home-root">
  <!-- Sección de banner personalizado -->
  <section class="banner">
    <div class="overlay">
      <h1>Yakart Toppers Personalizados</h1>
      <p>Crea tu pedido personalizado</p>
      <button (click)="irACustomOrders()">Haz tu pedido</button>
    </div>
  </section>

  <!-- Sección de productos -->
  <section class="productos" (click)="irACatalogo()">
    <h2>Productos</h2>
    <div class="productos-grid">
      <div class="producto" *ngFor="let p of productos">
        <img [src]="p.image_url" [alt]="p.name" />
        <h3>{{ p.name }}</h3>
        <p>${{ p.price }}</p>
      </div>
    </div>
  </section>

<!-- Sección de otros productos -->
<section class="otros">
  <h2>Otros Productos</h2>
  <p-carousel [value]="otrosProductos" [numVisible]="3" [numScroll]="1"
              [circular]="true" [responsiveOptions]="carouselResponsiveOptions">
    <ng-template pTemplate="item" let-product>
      <div class="slide-card" (click)="irAProducto(product.id_product!)">
        <img [src]="product.image_url" [alt]="product.name" />
        <h3>{{ product.name }}</h3>
        <p>${{ product.price }}</p>
      </div>
    </ng-template>
  </p-carousel>
</section>

<!-- Sección de custom orders -->
<section class="custom-orders">
  <h2>#YakArt</h2>
  <p-carousel [value]="customOrders" [numVisible]="5" [numScroll]="5"
              [circular]="true" [responsiveOptions]="carouselResponsiveOptions">
    <ng-template pTemplate="item" let-order>
      <div class="slide-card">
        <img [src]="order.image_url" [alt]="order.description" />
        <p>{{ order.description }}</p>
      </div>
    </ng-template>
  </p-carousel>
</section>
