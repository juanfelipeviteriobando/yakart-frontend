<div class="register-container fade-in">
  <div class="register-card">
    <div class="text-center mb-4">
      <h2 class="title">Restablecer contraseña</h2>
      <p class="subtitle">Ingresa tu nueva contraseña para continuar</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="form-group">
        <label for="password">Nueva contraseña</label>
        <p-password
          id="password"
          formControlName="password"
          [feedback]="true"
          placeholder="********"
        ></p-password>

        <small *ngIf="form.get('password')?.touched && form.get('password')?.invalid"
               class="text-red-500">
          La contraseña debe tener al menos 6 caracteres.
        </small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar contraseña</label>
        <p-password
          id="confirmPassword"
          formControlName="confirmPassword"
          [feedback]="false"
          placeholder="********"
        ></p-password>

        <small *ngIf="form.errors?.['mismatch']"
               class="text-red-500">
          Las contraseñas no coinciden.
        </small>
      </div>

      <button
        pButton
        pRipple
        label="Guardar contraseña"
        class="pink-btn mt-3"
        [disabled]="loading"
      ></button>

      <div *ngIf="error" class="text-red-500 text-center mt-3">
        {{ error }}
      </div>

      <div *ngIf="success" class="text-green-500 text-center mt-3">
        {{ success }}
      </div>

    </form>

  </div>
</div>
