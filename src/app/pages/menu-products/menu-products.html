<div class="admin-products-page">
  <div class="header text-center">
    <h1>MENÚ PRODUCTOS</h1>
    <p>Administra tus productos</p>
  </div>

  <div class="table-card">
    <div class="table-header flex justify-between items-center mb-3">
      <h2>Lista de productos</h2>
      <button pButton icon="pi pi-plus" class="p-button-rounded p-button-success" (click)="openNew()"></button>
    </div>

    <p-table [value]="products" responsiveLayout="scroll">
  <ng-template pTemplate="header">
    <tr>
      <th>Producto</th>
      <th>Descripción</th>
      <th>Precio</th>
      <th>Tamaño</th>
      <th>Categoría</th>
      <th>Stock</th>
      <th>Acciones</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-product>
    <tr>
      <td class="flex items-center gap-2">
        <img *ngIf="product.image_url" [src]="product.image_url" width="60" class="rounded shadow" />
        <span>{{ product.name }}</span>
      </td>
      <td>{{ product.description || '—' }}</td>
      <td>\${{ product.price }}</td>
      <td>{{ product.size }}</td>
      <td>{{ product.category }}</td>
      <td>{{ product.stock }}</td>
      <td class="flex gap-2">
        <button *ngIf="product.is_active" pButton icon="pi pi-pencil" class="p-button-warning p-button-rounded" (click)="editProduct(product)"></button>
        <button *ngIf="product.is_active" pButton icon="pi pi-trash" class="p-button-danger p-button-rounded" (click)="deleteProduct(product.id_product!)"></button>
        <button *ngIf="!product.is_active" pButton icon="pi pi-refresh" class="p-button-success p-button-rounded" (click)="restoreProduct(product.id_product!)" title="Restaurar"></button>
      </td>
    </tr>
  </ng-template>
</p-table>

  </div>

  <!-- DIALOG -->
  <p-dialog [(visible)]="productDialog" [modal]="true" [style]="{ width: '500px' }" header="{{ editMode ? 'Editar Producto' : 'Nuevo Producto' }}">
    <div class="dialog-form flex flex-col gap-3">
      <div>
        <label>Nombre *</label>
        <input pInputText [(ngModel)]="selectedProduct.name" />
      </div>
      <div>
        <label>Descripción</label>
        <textarea pInputTextarea [(ngModel)]="selectedProduct.description" rows="3"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label>Precio *</label>
          <input type="number" pInputText [(ngModel)]="selectedProduct.price" />
        </div>
        <div>
          <label>Tamaño</label>
          <input type="number" pInputText [(ngModel)]="selectedProduct.size" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label>Stock *</label>
          <input type="number" pInputText [(ngModel)]="selectedProduct.stock" />
        </div>
        <div>
          <label>Categoría *</label>
          <input pInputText [(ngModel)]="selectedProduct.category" />
        </div>
      </div>

      <div>
        <label>Imagen del producto</label>
        <p-fileupload mode="advanced" name="file" accept="image/*" maxFileSize="2000000"
                      chooseLabel="Seleccionar" uploadLabel="Subir" cancelLabel="Cancelar"
                      [customUpload]="true" (uploadHandler)="uploadImage($event)">
        </p-fileupload>

        <div *ngIf="uploadedImageUrl" class="image-preview">
          <img [src]="uploadedImageUrl" alt="Vista previa" />
        </div>
      </div>
    </div>

    <ng-template pTemplate="footer">
      <button pButton label="Cancelar" icon="pi pi-times" class="p-button-text" (click)="hideDialog()"></button>
      <button pButton label="Guardar" icon="pi pi-check" (click)="saveProduct()"></button>
    </ng-template>
  </p-dialog>
</div>
