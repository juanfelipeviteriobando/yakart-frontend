<div class="forgot-password-page">
  <div class="forgot-password-container fade-in">
    <div class="forgot-password-card">
      <div class="text-center mb-4">
        <img src="../../../../img/yakart-logo.png" alt="logo YakArt" height="50" class="mb-3" />
        <h2 class="title">Recuperar contraseña</h2>
        <p class="subtitle">Ingresa tu correo para recibir las instrucciones</p>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          pInputText
          [(ngModel)]="email"
          placeholder="correo@ejemplo.com"
        />
      </div>

      <button
        pButton
        pRipple
        label="Enviar correo"
        class="pink-btn"
        (click)="sendRecoveryEmail()"
        [disabled]="loading"
      ></button>

      <!-- Mensajes -->
      <div *ngIf="successMessage" class="success-message">
        {{ successMessage }}
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <div class="text-center mt-4">
        <a [routerLink]="['/auth/login']" class="login-link">
          Volver al inicio de sesión
        </a>
      </div>
    </div>
  </div>
</div>
