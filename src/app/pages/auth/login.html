<div class="register-container fade-in">
  <div class="register-card">
    <!-- Logo y títulos -->
    <div class="text-center mb-4">
      <img src="../../../../img/yakart-logo.png" alt="logo YakArt" height="50" class="mb-3" />
      <h2 class="title">Bienvenido de nuevo</h2>
      <p class="subtitle">Inicia sesión para continuar</p>
    </div>

    <!-- Formulario de inicio de sesión -->
    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        type="email"
        pInputText
        [(ngModel)]="email"
        placeholder="correo@ejemplo.com"
      />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <p-password
        id="password"
        [(ngModel)]="password"
        [feedback]="false"
        placeholder="********"
      ></p-password>
    </div>

    <!-- Recordarme y olvidar contraseña -->
    <div class="flex align-items-center justify-content-between mb-4">
      <div class="flex align-items-center">
        <p-checkbox
          name="remember"
          binary="true"
          [(ngModel)]="checked"
          inputId="remember"
        ></p-checkbox>
        <label for="remember" class="ml-2 text-900">Recordarme</label>
      </div>      
    </div>
    <div class="forgot-container">
    <a routerLink="/forgot-password" class="forgot-link">¿Olvidaste tu contraseña?</a>
    </div>


    <!-- Botón de login -->
    <button
      pButton
      pRipple
      label="Iniciar sesión"
      class="pink-btn"
      (click)="login()"
    ></button>

    <!-- Mensaje de error -->
    <div *ngIf="errorMessage" class="text-red-500 text-center mt-3">
      {{ errorMessage }}
    </div>

    <div class="register-section">
  <span class="divider-text">¿No tienes cuenta?</span>
  <button
    pButton
    pRipple
    label="Regístrate"
    class="white-btn mt-2"
    [routerLink]="['/auth/register']"
  ></button>
</div>
  </div>
</div>
